name: Publish CNNA v12 snapshot 20260717

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cnna-v12-20260717.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build, verify, and publish snapshot
        shell: bash
        run: |
          set -uo pipefail
          BUILD_INPUT='.build/cnna-v12-20260717'
          OLD_SNAPSHOT='Sierpinski Tetraeder_PoC/CNNA/Snapshot/20260716/CNNA_finite_core_snapshot_20260716.zip'
          DEST='Sierpinski Tetraeder_PoC/CNNA/Snapshot/20260717'
          WORK='/tmp/cnna_v12_20260717'
          OUT='/tmp/cnna_v12_20260717_out'
          LOG='/tmp/cnna_v12_20260717_build.log'
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/src" "$OUT"

          set +e
          (
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip zip patch \
              texlive-latex-base texlive-latex-recommended \
              texlive-latex-extra texlive-fonts-recommended poppler-utils

            cat "$BUILD_INPUT"/patch.b64.part00 \
                "$BUILD_INPUT"/patch.b64.part01 \
                "$BUILD_INPUT"/patch.b64.part02 \
                "$BUILD_INPUT"/patch.b64.part03 \
                "$BUILD_INPUT"/patch.b64.part04 \
              | base64 --decode > "$WORK/CNNA_v12_related_work_literature_audit.patch"
            echo 'f68264932e646cd8db504cdd0a1975b756eea4c5dfb4e624e7da7cc86a3e15d8  '"$WORK/CNNA_v12_related_work_literature_audit.patch" | sha256sum -c -

            unzip -q "$OLD_SNAPSHOT" -d "$WORK/src"
            cd "$WORK/src"
            mv cnna_core_derived_documentation.tex cnna_core_derived_documentation_v11.tex
            patch --batch cnna_core_derived_documentation_v11.tex < "$WORK/CNNA_v12_related_work_literature_audit.patch"
            mv cnna_core_derived_documentation_v11.tex cnna_core_derived_documentation.tex
            echo '39cbb78f1efef38abaceb297da254172061d39025234fd8fe1effd9be11cb221  cnna_core_derived_documentation.tex' | sha256sum -c -

            pdflatex -interaction=nonstopmode -halt-on-error cnna_core_derived_documentation.tex
            pdflatex -interaction=nonstopmode -halt-on-error cnna_core_derived_documentation.tex
            pdflatex -interaction=nonstopmode -halt-on-error cnna_core_derived_documentation.tex
            pdfinfo cnna_core_derived_documentation.pdf | grep '^Pages:'

            cp cnna_core_derived_documentation.tex "$OUT/cnna_core_derived_documentation_v12_related_work_literature_audit.tex"
            cp cnna_core_derived_documentation.pdf "$OUT/cnna_core_derived_documentation_v12_related_work_literature_audit.pdf"
            cp "$WORK/CNNA_v12_related_work_literature_audit.patch" "$OUT/CNNA_v12_related_work_literature_audit.patch"

            rm -f ./*.aux ./*.log ./*.out ./*.toc ./*.pdf
            zip -X -q -r "$OUT/CNNA_arXiv_source_2026-07-17_v12_related_work_literature_audit.zip" .
          ) >"$LOG" 2>&1
          rc=$?
          set -e
          cat "$LOG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p "$DEST"

          if [ "$rc" -eq 0 ]; then
            cp "$OUT/cnna_core_derived_documentation_v12_related_work_literature_audit.tex" "$DEST/"
            cp "$OUT/cnna_core_derived_documentation_v12_related_work_literature_audit.pdf" "$DEST/"
            cp "$OUT/CNNA_arXiv_source_2026-07-17_v12_related_work_literature_audit.zip" "$DEST/"
            cp "$OUT/CNNA_v12_related_work_literature_audit.patch" "$DEST/"
            rm -f "$DEST/BUILD_FAILURE.log"
            (
              cd "$DEST"
              sha256sum \
                cnna_core_derived_documentation_v12_related_work_literature_audit.tex \
                cnna_core_derived_documentation_v12_related_work_literature_audit.pdf \
                CNNA_arXiv_source_2026-07-17_v12_related_work_literature_audit.zip \
                CNNA_v12_related_work_literature_audit.patch \
                CHANGELOG_v12_related_work_literature_audit.md \
                > SHA256SUMS_v12_related_work_literature_audit.txt
              sha256sum -c SHA256SUMS_v12_related_work_literature_audit.txt
            )
            rm -rf "$BUILD_INPUT"
            rm -f '.github/workflows/publish-cnna-v12-20260717.yml'
            message='Publish CNNA v12 snapshot 20260717'
          else
            cp "$LOG" "$DEST/BUILD_FAILURE.log"
            message='Record CNNA v12 publication failure'
          fi

          git add -A
          git commit -m "$message"
          git push origin HEAD:main
          exit "$rc"
