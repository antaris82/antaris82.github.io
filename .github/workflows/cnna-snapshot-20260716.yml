name: Build CNNA snapshot 20260716

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cnna-snapshot-20260716.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip patch texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils

      - name: Reconstruct and compile snapshot
        shell: bash
        run: |
          set -euo pipefail
          SRC='Sierpinski Tetraeder_PoC/CNNA/Snapshot/20160710/CNNA_arXiv_source_2026-07-10_v7_FINAL_r2.zip'
          PATCH_B64='Sierpinski Tetraeder_PoC/CNNA/Snapshot/20260716/.build/cnna_v7_to_v11.patch.gz.b64'
          WORK='/tmp/cnna_snapshot_20260716'
          OUT='/tmp/cnna_snapshot_outputs_20260716'
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT"
          unzip -q "$SRC" -d "$WORK"
          base64 -d "$PATCH_B64" | gzip -d > /tmp/cnna_v7_to_v11.patch
          (
            cd "$WORK"
            patch -p1 --batch --forward < /tmp/cnna_v7_to_v11.patch
            pdflatex -interaction=nonstopmode -halt-on-error cnna_core_derived_documentation.tex
            pdflatex -interaction=nonstopmode -halt-on-error cnna_core_derived_documentation.tex
            pdfinfo cnna_core_derived_documentation.pdf | grep '^Pages:'
            cp cnna_core_derived_documentation.pdf "$OUT/CNNA_finite_core_snapshot_20260716.pdf"
            rm -f ./*.aux ./*.log ./*.out ./*.toc
            zip -X -q -r "$OUT/CNNA_finite_core_snapshot_20260716.zip" .
          )
          (
            cd "$OUT"
            sha256sum CNNA_finite_core_snapshot_20260716.zip CNNA_finite_core_snapshot_20260716.pdf > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish snapshot and remove temporary build inputs
        shell: bash
        run: |
          set -euo pipefail
          DEST='Sierpinski Tetraeder_PoC/CNNA/Snapshot/20260716'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p "$DEST"
          cp /tmp/cnna_snapshot_outputs_20260716/CNNA_finite_core_snapshot_20260716.zip "$DEST/"
          cp /tmp/cnna_snapshot_outputs_20260716/CNNA_finite_core_snapshot_20260716.pdf "$DEST/"
          cp /tmp/cnna_snapshot_outputs_20260716/SHA256SUMS.txt "$DEST/"
          rm -rf "$DEST/.build"
          rm -f .github/workflows/cnna-snapshot-20260716.yml
          git add -A
          git commit -m 'Publish CNNA finite-core snapshot 20260716'

          python3 - <<'PY'
          import datetime
          import json
          import subprocess

          ref = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          lines = subprocess.check_output(['git', 'ls-tree', '-r', '-l', 'HEAD'], text=True).splitlines()
          entries = []
          for line in lines:
              meta, path = line.split('\t', 1)
              mode, typ, sha, size = meta.split(None, 3)
              entries.append({
                  'path': path,
                  'sha': sha,
                  'size': 0 if size == '-' else int(size),
                  'type': typ,
                  'mode': mode,
              })
          entries.sort(key=lambda item: item['path'])
          with open('manifest.json', 'w', encoding='utf-8') as handle:
              json.dump(entries, handle, indent=2, ensure_ascii=False)
          version = {
              'sha': ref,
              'entries': len(entries),
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          with open('manifest.version.json', 'w', encoding='utf-8') as handle:
              json.dump(version, handle, indent=2)
          PY

          git add manifest.json manifest.version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update manifest'
          fi
          git push origin HEAD:main
